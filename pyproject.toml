[project]
name = "closing-agent"
version = "0.1.0"
description = "Claude-powered closing agent: pricing engine, contract audit, buyer reminders, CRM widget"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency-injection idiom (File(...), Depends(...))

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["closing_agent"]
